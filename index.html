<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆包 · 技能工作台</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg0:#121318;
    --bg1:#181A20;
    --bg2:#1E2129;
    --bg3:#262A35;
    --ink:#EEF0F6;
    --ink2:#A8ADBB;
    --mute:#6D7383;
    --line:#2B2F3A;
    --line2:#363B49;
    --amber:#E6B45E;
    --amber2:#F4D08A;
    --good:#58C987;
    --serif:'Noto Serif SC','Songti SC','SimSun',serif;
    --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    --mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
    --shadow:0 18px 44px rgba(0,0,0,.42);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 540px at 80% -12%, rgba(230,180,94,.075), transparent 60%),
      radial-gradient(900px 480px at 6% -4%, rgba(124,150,255,.07), transparent 55%),
      var(--bg0);
    color:var(--ink);
    font-family:var(--sans);
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    overflow-x:auto;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse 70% 46% at 50% 0%, #000 34%, transparent 78%);
            mask-image:radial-gradient(ellipse 70% 46% at 50% 0%, #000 34%, transparent 78%);
  }
  ::selection{background:rgba(230,180,94,.28)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid var(--bg0)}
  ::-webkit-scrollbar-thumb:hover{background:#454B5C}
  ::-webkit-scrollbar-track{background:transparent}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}

  .cockpit{
    position:sticky;top:0;z-index:60;
    background:rgba(20,22,29,.72);
    -webkit-backdrop-filter:blur(16px) saturate(1.25);
            backdrop-filter:blur(16px) saturate(1.25);
    border-bottom:1px solid var(--line);
    box-shadow:0 10px 34px rgba(0,0,0,.28);
  }
  .cockpit::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg, transparent, rgba(230,180,94,.35), transparent);
    pointer-events:none;
  }
  .cockpit-inner{
    max-width:1560px;margin:0 auto;
    padding:16px 28px;
    display:flex;align-items:center;gap:24px;
    min-width:1120px;position:relative;z-index:1;
  }
  .brand{display:flex;align-items:center;gap:14px;flex:none}
  .brand-logo{
    width:44px;height:44px;border-radius:14px;flex:none;
    background:
      radial-gradient(120% 120% at 20% 10%, rgba(244,208,138,.55), transparent 45%),
      linear-gradient(150deg,#2A2113,#171410 60%,#121318);
    border:1px solid rgba(230,180,94,.42);
    display:grid;place-items:center;
    box-shadow:0 6px 20px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04) inset, 0 0 22px rgba(230,180,94,.18);
  }
  .brand h1{
    font-family:var(--serif);font-weight:900;font-size:21px;letter-spacing:.6px;
    color:#F5F6FA;line-height:1.15;
    background:linear-gradient(180deg,#FFFFFF,#D9DCE6);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .brand .sub{
    font-family:var(--mono);font-size:9.5px;letter-spacing:3.4px;color:var(--amber);
    margin-top:4px;text-transform:uppercase;opacity:.9;
  }
  .stats{display:flex;gap:10px;flex:none}
  .stat{
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    border:1px solid var(--line);
    border-radius:13px;padding:7px 15px;min-width:96px;text-align:center;
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
  }
  .stat b{font-family:var(--mono);font-weight:700;font-size:18px;color:#FFFFFF;display:block;line-height:1.2}
  .stat b small{font-size:12px;color:var(--amber);font-weight:500}
  .stat:nth-child(1) b small{color:var(--amber)}
  .stat span{font-size:10.5px;color:var(--mute);letter-spacing:.8px}
  .search{
    flex:1;max-width:540px;margin-left:auto;position:relative;
  }
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mute)}
  .search input{
    width:100%;padding:12px 62px 12px 46px;
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
    border:1px solid var(--line);border-radius:14px;
    color:#F2F3F8;font-size:14px;font-family:var(--sans);outline:none;
    transition:border-color .18s, box-shadow .18s, background .18s;
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
  }
  .search input::placeholder{color:var(--mute)}
  .search input:focus{
    border-color:rgba(230,180,94,.6);
    background:rgba(255,255,255,.07);
    box-shadow:0 0 0 3px rgba(230,180,94,.14), 0 0 24px rgba(230,180,94,.12) inset;
  }
  .kbd{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    font-family:var(--mono);font-size:11px;color:var(--mute);
    border:1px solid var(--line2);border-radius:7px;padding:2px 8px;
    background:var(--bg2);pointer-events:none;
  }
  .status{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink2);flex:none}
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(88,201,135,.5);animation:pulse 2.4s infinite}
  .status .txt{letter-spacing:.4px}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(88,201,135,.5)}70%{box-shadow:0 0 0 8px rgba(88,201,135,0)}100%{box-shadow:0 0 0 0 rgba(88,201,135,0)}}

  .strip-wrap{max-width:1560px;margin:0 auto;padding:20px 28px 0;min-width:1120px;position:relative;z-index:1}
  .strip{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--line);gap:2px;padding:0}
  .strip i{display:block;height:100%;cursor:pointer;transition:transform .15s, opacity .15s;border-radius:2px}
  .strip i:hover{transform:scaleY(1.5);opacity:.9}
  .strip-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px}
  .strip-legend button{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--bg1);border:1px solid var(--line);cursor:pointer;
    font-family:var(--sans);font-size:12px;color:var(--ink2);padding:5px 12px;border-radius:20px;
    transition:border-color .15s,color .15s,transform .15s,box-shadow .15s;
  }
  .strip-legend button:hover{color:var(--ink);border-color:var(--line2);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.28)}
  .strip-legend button .sq{width:9px;height:9px;border-radius:3px;flex:none;box-shadow:0 0 8px rgba(255,255,255,.12) inset}
  .strip-legend button .n{font-family:var(--mono);color:var(--mute);font-size:11px}

  .layout{max-width:1560px;margin:0 auto;padding:24px 28px 70px;display:flex;gap:26px;min-width:1120px;position:relative;z-index:1}

  .rail{width:228px;flex:none;position:sticky;top:102px;align-self:flex-start;max-height:calc(100vh - 126px);overflow:auto;padding-right:4px}
  .rail-title{font-family:var(--mono);font-size:10px;letter-spacing:2.6px;color:var(--mute);font-weight:500;margin:2px 10px 12px;text-transform:uppercase}
  .rail-item{
    display:flex;align-items:center;gap:11px;width:100%;
    padding:10px 12px;border-radius:12px;
    background:none;cursor:pointer;text-align:left;border:1px solid transparent;
    font-family:var(--sans);font-size:13.5px;color:var(--ink2);
    transition:background .14s,color .14s,border-color .14s,transform .14s;margin-bottom:3px;
    position:relative;
  }
  .rail-item:hover{background:var(--bg2);color:var(--ink)}
  .rail-item .dot{width:10px;height:10px;border-radius:4px;flex:none;transition:transform .15s,box-shadow .15s}
  .rail-item:hover .dot{transform:scale(1.15)}
  .rail-item .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mute)}
  .rail-item.all .dot{background:linear-gradient(135deg,#F4D08A,#C9903A);box-shadow:0 0 10px rgba(230,180,94,.5)}
  .rail-item.active{
    background:linear-gradient(90deg, color-mix(in srgb,var(--rc,#E6B45E) 14%, transparent), transparent 85%);
    border-color:color-mix(in srgb,var(--rc,#E6B45E) 34%, var(--line));
    color:var(--ink);font-weight:600;
  }
  .rail-item.active .cnt{color:var(--ink2)}
  .rail-foot{margin:16px 10px 0;padding-top:16px;border-top:1px dashed var(--line2);font-size:11px;color:var(--mute);line-height:1.8}

  .main{flex:1;min-width:0}
  .toolbar{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .toolbar h2{font-family:var(--serif);font-weight:900;font-size:24px;color:#F5F6FA;letter-spacing:.5px}
  .toolbar h2::before{content:"";display:inline-block;width:5px;height:18px;border-radius:3px;margin-right:12px;vertical-align:-2px;
    background:linear-gradient(180deg,var(--amber),#C9903A);box-shadow:0 0 12px rgba(230,180,94,.55)}
  .toolbar .res{font-family:var(--mono);font-size:12px;color:var(--mute)}
  .toolbar .clear{margin-left:auto;background:none;border:1px solid var(--line2);color:var(--amber);font-size:12.5px;cursor:pointer;font-family:var(--sans);display:none;padding:6px 14px;border-radius:20px;transition:border-color .15s,background .15s}
  .toolbar .clear.show{display:inline}
  .toolbar .clear:hover{background:rgba(230,180,94,.1);border-color:rgba(230,180,94,.5)}

  .recent{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:linear-gradient(180deg, var(--bg1), var(--bg0));
    border:1px solid var(--line);border-radius:14px;
    padding:10px 14px;margin-bottom:18px;
  }
  .recent .rt{font-size:11px;color:var(--mute);margin-right:4px;letter-spacing:1.6px;font-family:var(--mono)}
  .recent button{
    background:var(--bg2);border:1px solid var(--line2);border-radius:20px;
    padding:4px 13px;font-size:12px;color:var(--ink2);cursor:pointer;font-family:var(--sans);
    transition:background .12s,color .12s,border-color .12s;
  }
  .recent button:hover{background:var(--amber);color:#1A1407;border-color:var(--amber)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}

  .card{
    --c:#3ED6B4;
    background:linear-gradient(180deg, var(--bg1), #16181E);
    border:1px solid var(--line);
    border-radius:16px;
    padding:17px 17px 14px;
    cursor:pointer;position:relative;overflow:hidden;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s;
    animation:fadeUp .42s both;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg, var(--c), color-mix(in srgb,var(--c) 35%, transparent));
    opacity:.9;transition:opacity .18s;
  }
  .card::after{
    content:"";position:absolute;right:-40px;top:-40px;width:110px;height:110px;border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb,var(--c) 12%, transparent), transparent 70%);
    pointer-events:none;transition:transform .25s;
  }
  .card:hover{
    transform:translateY(-5px);
    border-color:color-mix(in srgb,var(--c) 36%, var(--line));
    box-shadow:0 20px 46px rgba(0,0,0,.5), 0 0 0 1px color-mix(in srgb,var(--c) 12%, transparent), 0 0 30px color-mix(in srgb,var(--c) 9%, transparent);
  }
  .card:hover::after{transform:scale(1.25)}
  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .led{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 3px rgba(88,201,135,.14),0 0 8px rgba(88,201,135,.6)}
  .chip{
    font-size:11px;font-weight:600;letter-spacing:.4px;
    color:color-mix(in srgb,var(--c) 78%, #fff);
    background:color-mix(in srgb,var(--c) 15%, transparent);
    border:1px solid color-mix(in srgb,var(--c) 26%, transparent);
    padding:2px 10px;border-radius:20px;
  }
  .card h3{font-size:16px;font-weight:700;color:#F2F3F8;line-height:1.35;margin-bottom:6px}
  .card .tag{font-size:12.5px;color:var(--ink2);line-height:1.6;min-height:40px}
  .card .code{
    font-family:var(--mono);font-size:10.5px;color:var(--mute);
    margin-top:11px;padding-top:10px;border-top:1px dashed var(--line2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .card .open{
    position:absolute;right:15px;bottom:13px;font-size:12px;
    color:var(--c);opacity:0;transform:translateX(8px);transition:opacity .16s,transform .16s;font-weight:600;
  }
  .card:hover .open{opacity:1;transform:translateX(0)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .empty{
    grid-column:1/-1;text-align:center;padding:76px 20px;color:var(--mute);
    border:1px dashed var(--line2);border-radius:16px;
    background:linear-gradient(180deg, var(--bg1), transparent);
  }
  .empty b{display:block;font-size:15px;color:var(--ink2);margin-bottom:6px}

  .scrim{
    position:fixed;inset:0;background:rgba(6,7,10,.58);z-index:80;
    opacity:0;pointer-events:none;transition:opacity .25s;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:486px;max-width:94vw;z-index:90;
    background:linear-gradient(180deg, #191B22, #14151B);
    border-left:1px solid var(--line);
    box-shadow:-30px 0 70px rgba(0,0,0,.5);
    transform:translateX(102%);transition:transform .3s cubic-bezier(.3,.8,.3,1);
    display:flex;flex-direction:column;
  }
  .drawer.open{transform:none}
  .drawer-head{
    padding:28px 30px 22px;border-bottom:1px solid var(--line2);position:relative;
    background:
      radial-gradient(120% 150% at 100% 0%, color-mix(in srgb,var(--c,var(--amber)) 13%, transparent), transparent 62%),
      linear-gradient(180deg, #1B1E26, #16181E);
  }
  .drawer-head::after{
    content:"";position:absolute;left:30px;right:30px;bottom:-1px;height:1px;
    background:linear-gradient(90deg, transparent, color-mix(in srgb,var(--c,var(--amber)) 45%, transparent), transparent);
  }
  .drawer-head .meta{display:flex;align-items:center;gap:10px;margin-bottom:13px}
  .drawer-head .chip{font-size:12px;padding:3px 12px}
  .drawer-head h2{font-family:var(--serif);font-weight:900;font-size:27px;color:#F5F6FA;line-height:1.28;letter-spacing:.5px}
  .drawer-head .code{font-family:var(--mono);font-size:11.5px;color:var(--mute);margin-top:10px;letter-spacing:.6px}
  .drawer-close{
    position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:11px;
    border:1px solid var(--line2);background:var(--bg2);cursor:pointer;
    display:grid;place-items:center;color:var(--ink2);transition:background .14s,color .14s,border-color .14s;
  }
  .drawer-close:hover{background:var(--amber);color:#1A1407;border-color:var(--amber)}
  .drawer-body{flex:1;overflow:auto;padding:24px 30px 32px}
  .drawer-body h4{
    font-family:var(--mono);font-size:10px;letter-spacing:2.4px;color:var(--amber);
    font-weight:600;margin:24px 0 9px;text-transform:uppercase;
  }
  .drawer-body h4:first-child{margin-top:0}
  .drawer-body .desc{font-size:14px;line-height:1.85;color:var(--ink2)}
  .keys{display:flex;flex-wrap:wrap;gap:8px}
  .keys span{
    font-size:12px;color:var(--ink2);background:var(--bg2);
    border:1px solid var(--line2);border-radius:9px;padding:4px 11px;font-family:var(--mono);
    transition:border-color .14s,color .14s;
  }
  .keys span:hover{border-color:color-mix(in srgb,var(--c,var(--amber)) 45%, var(--line2));color:var(--ink)}
  .howto{
    background:linear-gradient(180deg, rgba(230,180,94,.05), transparent);
    border:1px dashed color-mix(in srgb,var(--c,var(--amber)) 40%, var(--line2));
    border-radius:14px;padding:16px 18px;
    font-size:13px;color:var(--ink2);line-height:1.9;
  }
  .howto b{color:var(--ink)}
  .howto code{
    font-family:var(--mono);font-size:12px;background:rgba(230,180,94,.12);color:var(--amber2);
    padding:1px 7px;border-radius:6px;
  }
  .drawer-foot{
    padding:16px 30px;border-top:1px solid var(--line2);background:#14151B;
    display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);
  }
  .drawer-foot .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px rgba(88,201,135,.7);flex:none}

  @media (max-width:1160px){
    .layout{min-width:0;flex-direction:column}
    .rail{position:static;width:100%;display:flex;flex-wrap:wrap;gap:6px;overflow:visible;max-height:none;padding-right:0}
    .rail-title{width:100%;margin:0 4px 6px}
    .rail-item{width:auto;margin:0}
    .rail-foot{display:none}
    .cockpit-inner,.strip-wrap{min-width:0}
    .status{display:none}
    .search{max-width:none}
  }
</style>
</head>
<body>

  <!-- ===== 顶部控制台 ===== -->
  <header class="cockpit">
    <div class="cockpit-inner">
      <div class="brand">
        <div class="brand-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <rect x="2.5" y="2.5" width="19" height="19" rx="4.5" stroke="#F4D08A" stroke-width="1.5"/>
            <path d="M7 9.5h10M7 14.5h6.5" stroke="#F4D08A" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="16.9" cy="14.6" r="1.7" fill="#E6B45E"/>
          </svg>
        </div>
        <div>
          <h1>豆包 · 技能工作台</h1>
          <div class="sub">Skill Workbench</div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="text" placeholder="搜索技能：名称、场景或关键词…" autocomplete="off">
        <span class="kbd">/</span>
      </div>
      <div class="status"><span class="dot"></span><span class="txt">全部技能就绪</span></div>
    </div>
  </header>

  <!-- ===== 分类分布条 ===== -->
  <div class="strip-wrap">
    <div class="strip" id="strip"></div>
    <div class="strip-legend" id="legend"></div>
  </div>

  <!-- ===== 主体 ===== -->
  <div class="layout">
    <aside class="rail">
      <div class="rail-title">技能分类</div>
      <div id="rail"></div>
      <div class="rail-foot">豆包技能工作台 · 所有能力随对话即取即用。点击技能卡片查看使用方式。</div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <h2 id="curTitle">全部技能</h2>
        <span class="res" id="res"></span>
        <button class="clear" id="clear">清除筛选</button>
      </div>
      <div class="recent" id="recentWrap" hidden>
        <span class="rt">最近查看</span>
        <span id="recentChips"></span>
      </div>
      <div class="grid" id="grid"></div>
    </main>
  </div>

  <!-- ===== 详情抽屉 ===== -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" style="--c:#E6B45E">
    <button class="drawer-close" id="drawerClose" aria-label="关闭">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="drawer-head" id="drawerHead"></div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot"><span class="dot"></span>该技能已安装并处于就绪状态</div>
  </aside>

<script>
/* ===== 分类 ===== */
const CATS = [
  {key:'content',  name:'内容创作',     color:'#FF7A6B'},
  {key:'slides',   name:'演示 & PPT',   color:'#F2B24C'},

/* ===== 状态 ===== */
const state = { cat:'all', q:'', recent:[] };
try{ state.recent = JSON.parse(localStorage.getItem('skills_workbench_recent')||'[]'); }catch(e){ state.recent=[]; }

const $ = s => document.querySelector(s);
const byId = id => DATA.find(d=>d.id===id);

function catCounts(){ const m={}; DATA.forEach(d=>{m[d.cat]=(m[d.cat]||0)+1}); const out={}; CATS.forEach(x=>out[x.key]=m[x.key]||0); return out; }

/* ===== 渲染 ===== */
function renderStats(){
  const cc = catCounts();
  $('#stats').innerHTML =
    `<div class="stat"><b>${DATA.length}<small> 项</small></b><span>已装技能</span></div>`+
    `<div class="stat"><b>${CATS.length}<small> 类</small></b><span>能力分类</span></div>`+
    `<div class="stat"><b>${Object.values(cc).reduce((a,b)=>a+b,0)}<small> 项</small></b><span>可用入口</span></div>`;
}
function renderStrip(){
  const cc = catCounts(); const total = DATA.length;
  $('#strip').innerHTML = CATS.map(c=>`<i style="width:${(cc[c.key]/total*100).toFixed(2)}%;background:linear-gradient(180deg,${c.color},${c.color}99)" data-cat="${c.key}" title="${c.name} ${cc[c.key]}"></i>`).join('');
  $('#legend').innerHTML = CATS.map(c=>`<button data-cat="${c.key}"><span class="sq" style="background:${c.color}"></span>${c.name}<span class="n">${cc[c.key]}</span></button>`).join('');
}
function renderRail(){
  const cc = catCounts();
  const all = `<button class="rail-item all ${state.cat==='all'?'active':''}" data-cat="all" style="--rc:#E6B45E"><span class="dot"></span>全部技能<span class="cnt">${DATA.length}</span></button>`;
  const items = CATS.map(c=>`<button class="rail-item ${state.cat===c.key?'active':''}" data-cat="${c.key}" style="--rc:${c.color}"><span class="dot" style="background:${c.color};box-shadow:0 0 8px ${c.color}66"></span>${c.name}<span class="cnt">${cc[c.key]}</span></button>`).join('');
  $('#rail').innerHTML = all + items;
}
function filtered(){
  const q = state.q.trim().toLowerCase();
  return DATA.filter(d=>{
    if(state.cat!=='all' && d.cat!==state.cat) return false;
    if(!q) return true;
    const hay = (d.name+' '+d.tag+' '+d.desc+' '+d.id+' '+d.keys.join(' ')).toLowerCase();
    return hay.includes(q);
  });
}
function renderGrid(){
  const list = filtered();
  $('#curTitle').textContent = state.cat==='all' ? '全部技能' : catOf(state.cat).name;
  $('#res').textContent = list.length + ' / ' + DATA.length + ' 项';
  $('#clear').classList.toggle('show', !!(state.q || state.cat!=='all'));
  if(!list.length){
    $('#grid').innerHTML = `<div class="empty"><b>没有匹配的技能</b>换个关键词，或清除筛选再试试。</div>`;
    return;
  }
  $('#grid').innerHTML = list.map((d,i)=>{
    const c = catOf(d.cat);
    return `<article class="card" style="--c:${c.color};animation-delay:${Math.min(i*16,300)}ms" data-id="${d.id}" tabindex="0" role="button" aria-label="${d.name}">
      <div class="card-top"><span class="led"></span><span class="chip">${c.name}</span></div>
      <h3>${d.name}</h3>
      <p class="tag">${d.tag}</p>
      <div class="code">${d.id}</div>
      <span class="open">查看详情 →</span>
    </article>`;
  }).join('');
}
function renderRecent(){
  const wrap = $('#recentWrap');
  if(!state.recent.length){ wrap.hidden = true; return; }
  wrap.hidden = false;
  $('#recentChips').innerHTML = state.recent.map(id=>{
    const d = byId(id); if(!d) return '';
    return `<button data-id="${id}">${d.name}</button>`;
  }).join('');
}

/* ===== 详情抽屉 ===== */
function openDrawer(id){
  const d = byId(id); if(!d) return;
  const c = catOf(d.cat);
  document.getElementById('drawer').style.setProperty('--c', c.color);
  $('#drawerHead').innerHTML = `
    <div class="meta"><span class="chip" style="color:${c.color};background:${c.color}1f;border-color:${c.color}40">${c.name}</span><span class="led" style="width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px rgba(88,201,135,.7)"></span></div>
    <h2>${d.name}</h2>
    <div class="code">MODULE · ${d.id}</div>`;
  $('#drawerBody').innerHTML = `
    <h4>能力说明</h4>
    <p class="desc">${d.desc}</p>
    <h4>定位</h4>
    <p class="desc">${d.tag}</p>
    <h4>唤起关键词</h4>
    <div class="keys">${d.keys.map(k=>`<span>${k}</span>`).join('')}</div>
    <h4>如何使用</h4>
    <div class="howto">直接在豆包对话中描述需求即可唤起该技能。<br>例如：<code>帮我用「${d.name}」${d.tag.split(' · ')[0]}</code></div>`;
  $('#drawer').classList.add('open');
  $('#scrim').classList.add('show');
  state.recent = [id, ...state.recent.filter(x=>x!==id)].slice(0,6);
  try{ localStorage.setItem('skills_workbench_recent', JSON.stringify(state.recent)); }catch(e){}
  renderRecent();
}
function closeDrawer(){
  $('#drawer').classList.remove('open');
  $('#scrim').classList.remove('show');
}

/* ===== 事件 ===== */
$('#grid').addEventListener('click', e=>{
  const card = e.target.closest('.card'); if(card) openDrawer(card.dataset.id);
});
$('#grid').addEventListener('keydown', e=>{
  if(e.key==='Enter' || e.key===' '){
    const card = e.target.closest('.card'); if(card){ e.preventDefault(); openDrawer(card.dataset.id); }
  }
});
$('#rail').addEventListener('click', e=>{
  const b = e.target.closest('button[data-cat]'); if(!b) return;
  state.cat = b.dataset.cat;
  renderRail(); renderGrid();
});
$('#legend').addEventListener('click', e=>{
  const b = e.target.closest('button[data-cat]'); if(!b) return;
  state.cat = b.dataset.cat;
  renderRail(); renderGrid();
});
$('#recentChips').addEventListener('click', e=>{
  const b = e.target.closest('button[data-id]'); if(b) openDrawer(b.dataset.id);
});
$('#clear').addEventListener('click', ()=>{ state.cat='all'; state.q=''; $('#q').value=''; renderRail(); renderGrid(); });
$('#q').addEventListener('input', e=>{ state.q = e.target.value; renderGrid(); });
$('#drawerClose').addEventListener('click', closeDrawer);
$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeDrawer();
  if(e.key==='/' && document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
});
$('#strip').addEventListener('click', e=>{
  const seg = e.target.closest('i[data-cat]'); if(!seg) return;
  state.cat = seg.dataset.cat; renderRail(); renderGrid();
});

/* ===== 初始化 ===== */
renderStats(); renderStrip(); renderRail(); renderGrid(); renderRecent();
</script>
